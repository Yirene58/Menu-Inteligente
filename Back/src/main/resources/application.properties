# ==========================================
# BASE DE DATOS - POSTGRESQL
# ==========================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=app123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appmovil_db

# ==========================================
# HIBERNATE ORM
# ==========================================

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# SERVIDOR QUARKUS
# ==========================================

quarkus.http.port=8080

# CORS: solo localhost/127.0.0.1 por defecto. En producción defina CORS_ORIGINS
# con el dominio exacto de la app (sin *).
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Sintaxis corregida para el Max Age (puedes usar 86400s o 24h)
quarkus.http.cors.access-control-allow-max-age=86400s

# SMTP: configure estas variables en el entorno; no guarde secretos en Git.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
quarkus.mailer.from=${SMTP_FROM:no-reply@gestortecno.com}
# En producción defina SMTP_MOCK=false junto con las credenciales SMTP.
quarkus.mailer.mock=${SMTP_MOCK:true}

