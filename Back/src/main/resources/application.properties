quarkus.datasource.password=${DB_PASSWORD:TUk6odx7kQETKjfjGIhDZxoXWoLke1vs}
quarkus.datasource.jdbc.url=${DB_URL:postgresql://menu_admin:TUk6odx7kQETKjfjGIhDZxoXWoLke1vs@dpg-dc1m52dg1s2s73doa4i0-a/menu_inteligente}

# ==========================================
# HIBERNATE ORM
# ==========================================

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# PERFIL "local": sin PostgreSQL, usa H2 guardado en Back/data/
#   .\mvnw.cmd quarkus:dev "-Dquarkus.profile=local"
# ==========================================
%local.quarkus.datasource.db-kind=h2
%local.quarkus.datasource.username=sa
%local.quarkus.datasource.password=
%local.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/menu-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
%local.quarkus.hibernate-orm.log.sql=false

# Gemini: configure la misma clave de entorno que usa el reconocimiento.
gemini.api.key=${GEMINI_API_KEY:}
# Modelo usado para reconocer alimentos en imágenes y tiempo máximo de espera.
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.vision.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}
# Las fotos llegan en Base64 (~1-2 MB); se amplía el límite del cuerpo HTTP.
quarkus.http.limits.max-body-size=15M

# ==========================================
# SERVIDOR QUARKUS
# ==========================================

quarkus.http.port=8080

# CORS: solo localhost/127.0.0.1 por defecto. En producción defina CORS_ORIGINS
# con el dominio exacto de la app (sin *).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=86400

# SMTP: configure estas variables en el entorno; no guarde secretos en Git.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
quarkus.mailer.from=${SMTP_FROM:no-reply@gestortecno.com}
# En producción defina SMTP_MOCK=false junto con las credenciales SMTP.
quarkus.mailer.mock=${SMTP_MOCK:true}
