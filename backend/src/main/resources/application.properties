# ==========================================
# BASE DE DATOS - POSTGRESQL
# ==========================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:Johan2329*}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/appmovil_db}

# ==========================================
# HIBERNATE ORM
# ==========================================

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# SERVIDOR QUARKUS
# ==========================================

quarkus.http.port=8080

# CORS para Flutter Web (ajusta el origen al desplegar en producción)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# SMTP: configure estas variables en el entorno; no guarde secretos en Git.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
quarkus.mailer.from=${SMTP_FROM:no-reply@gestortecno.com}
# En producción defina SMTP_MOCK=false junto con las credenciales SMTP.
quarkus.mailer.mock=${SMTP_MOCK:true}

