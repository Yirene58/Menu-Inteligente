# ==========================================
# BASE DE DATOS - POSTGRESQL
# ==========================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:app123}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/appmovil_db}

# ==========================================
# HIBERNATE ORM
# ==========================================

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# SERVIDOR QUARKUS & CORS
# ==========================================

quarkus.http.port=8080
quarkus.http.limits.max-body-size=10M
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# ==========================================
# SMTP / CORREO
# ==========================================

quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
quarkus.mailer.from=${SMTP_FROM:no-reply@gestortecno.com}
quarkus.mailer.mock=${SMTP_MOCK:true}

